# GitLab is the source of truth; GitHub receives published releases so HACS can
# find them. A tag pipeline validates the integration, packages it the way HACS
# expects, publishes a GitLab release, then mirrors both to GitHub.
#
# Required CI/CD variable:
#   GITHUB_PAT  Personal access token with `repo` scope, masked and protected.
#               Protect the variable and the tags, or tag pipelines cannot read it.

stages:
  - validate
  - package
  - release

variables:
  GITHUB_REPO: ChristophGoth/ha-anker-solix-v1-modbus
  INTEGRATION_PATH: custom_components/anker_solix_v1
  DOMAIN: anker_solix_v1

default:
  interruptible: true
  # Every runner on this instance sets run_untagged: false, so a job without a
  # tag is never picked up and the pipeline stalls until it is cancelled.
  tags:
    - docker

# The checks that run on every change worth checking, and on tags because a
# release must never ship what they would have caught.
.checked:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Syntax, JSON validity and the one thing a release must never get wrong: the
# manifest version has to match the tag it is released under.
validate:
  stage: validate
  extends: .checked
  image: python:3.13-alpine
  script:
    - python -m compileall -q "$INTEGRATION_PATH"
    - python ci/validate.py

# Home Assistant's own manifest and translation checks. Same container the
# hassfest GitHub Action runs, which is all that action does; it reads the
# working tree, so it belongs here rather than on GitHub.
hassfest:
  stage: validate
  extends: .checked
  image: docker:27-cli
  # docker-in-docker needs to mount and load modules, which the plain `docker`
  # runner is not allowed to do: its dind service cannot write the TLS
  # certificates and the client then finds no endpoint to talk to.
  tags:
    - docker-privileged
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    # TLS between the job and its own dind service would need a /certs volume
    # shared by both containers, which this runner does not set up. The service
    # is reachable only from this job over the runner's private network, so it
    # speaks plain TCP instead.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    # hassfest expects the repository at /github/workspace, the path the
    # Action mounts it on. Docker-in-Docker cannot see this job's checkout, so
    # the sources are copied into a named volume the daemon does have access to.
    - docker volume create "hassfest-$CI_JOB_ID"
    - |
      docker run --rm -v "hassfest-$CI_JOB_ID:/workspace" \
        -v "$CI_PROJECT_DIR:/src:ro" alpine:3.20 \
        sh -c 'cp -a /src/. /workspace/'
    - docker run --rm -v "hassfest-$CI_JOB_ID:/github/workspace" ghcr.io/home-assistant/hassfest
  after_script:
    - docker volume rm -f "hassfest-$CI_JOB_ID" || true

# Build the HACS zip once, so the GitLab release and the GitHub release are
# guaranteed to ship the same bytes.
package:
  stage: package
  extends: .checked
  image: alpine:3.20
  script:
    - apk add --no-cache zip
    # HACS unpacks this asset into custom_components/, so the zip has to contain
    # the integration directory itself, not its contents.
    - |
      (cd "$(dirname "$INTEGRATION_PATH")" && \
        zip -r -q "$CI_PROJECT_DIR/${DOMAIN}.zip" "$DOMAIN" -x '*__pycache__*' '*.pyc')
    - unzip -l "${DOMAIN}.zip"
  artifacts:
    paths:
      - ${DOMAIN}.zip
    expire_in: 30 days

# Publish the GitLab release. The zip goes into the generic package registry
# first: job artifacts expire, and a release asset has to outlive them.
release-gitlab:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - package
  before_script:
    - apk add --no-cache curl jq python3
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      PKG_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${DOMAIN}/${VERSION}/${DOMAIN}.zip"
      CODE=$(curl -sS -o upload.json -w '%{http_code}' \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "${DOMAIN}.zip" "$PKG_URL")
      case "$CODE" in
        201) echo "uploaded ${DOMAIN}.zip to the package registry" ;;
        # Re-running a tag pipeline re-uploads the same version. The registry
        # keeps both files and serves the newest, which is what we just sent.
        200) echo "replaced ${DOMAIN}.zip in the package registry" ;;
        *) echo "package upload failed (HTTP $CODE):"; cat upload.json; exit 1 ;;
      esac
      echo "PKG_URL=$PKG_URL" > release.env

    # Release notes: this version's section from CHANGELOG.md, or a pointer to
    # the file when the tag has no entry yet.
    - |
      . ./release.env
      VERSION="${CI_COMMIT_TAG#v}"
      NOTES=$(python3 ci/release_notes.py "$VERSION" || true)
      if [ -z "$NOTES" ]; then
        NOTES="Siehe [CHANGELOG.md](${CI_PROJECT_URL}/-/blob/${CI_COMMIT_TAG}/CHANGELOG.md)."
      fi
      jq -n --arg tag "$CI_COMMIT_TAG" --arg notes "$NOTES" \
            --arg name "${DOMAIN}.zip" --arg url "$PKG_URL" \
        '{tag_name: $tag, name: $tag, description: $notes,
          assets: {links: [{name: $name, url: $url, link_type: "package"}]}}' \
        > gitlab-release.json

    # Create the release, or update it when this tag is released again.
    - |
      CODE=$(curl -sS -o response.json -w '%{http_code}' \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --header "Content-Type: application/json" \
        --request POST --data @gitlab-release.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases")
      if [ "$CODE" = "201" ]; then
        echo "GitLab release ${CI_COMMIT_TAG} created"
      elif [ "$CODE" = "409" ]; then
        echo "GitLab release ${CI_COMMIT_TAG} exists; leaving it as published"
      else
        echo "GitLab refused the release (HTTP $CODE):"; jq -r '.message // .' response.json; exit 1
      fi
      echo "${CI_PROJECT_URL}/-/releases/${CI_COMMIT_TAG}"

# Push the tagged commit to GitHub and publish a release there. Runs only for
# tags, so ordinary branch pushes never reach GitHub.
release-to-github:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - package
  before_script:
    - apk add --no-cache git curl jq python3
    - test -n "$GITHUB_PAT" || { echo "GITHUB_PAT is not set for this pipeline"; exit 1; }
  script:
    # Mirror the tagged commit. The token goes into a credential file rather
    # than the remote URL, where an error message could echo it back.
    - |
      git config --global credential.helper store
      printf 'https://x-access-token:%s@github.com\n' "$GITHUB_PAT" > ~/.git-credentials
      chmod 600 ~/.git-credentials
      git remote add github "https://github.com/${GITHUB_REPO}.git" 2>/dev/null || \
        git remote set-url github "https://github.com/${GITHUB_REPO}.git"
      git push github "HEAD:refs/heads/${CI_DEFAULT_BRANCH}"
      git push github "refs/tags/${CI_COMMIT_TAG}"

    # Release notes: this version's section from CHANGELOG.md, or a pointer to
    # the file when the tag has no entry yet.
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      NOTES=$(python3 ci/release_notes.py "$VERSION" || true)
      if [ -z "$NOTES" ]; then
        NOTES="Siehe [CHANGELOG.md](https://github.com/${GITHUB_REPO}/blob/${CI_COMMIT_TAG}/CHANGELOG.md)."
      fi
      jq -n --arg tag "$CI_COMMIT_TAG" --arg name "$CI_COMMIT_TAG" --arg body "$NOTES" \
        '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}' > release.json

    # Create the release, or reuse it if this tag was already published.
    - |
      CODE=$(curl -sS -o response.json -w '%{http_code}' \
        -X POST "https://api.github.com/repos/${GITHUB_REPO}/releases" \
        -H "Authorization: Bearer ${GITHUB_PAT}" \
        -H "Accept: application/vnd.github+json" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        -d @release.json)
      if [ "$CODE" = "201" ]; then
        echo "release ${CI_COMMIT_TAG} created"
      elif [ "$CODE" = "422" ]; then
        echo "release ${CI_COMMIT_TAG} already exists, reusing it"
        curl -sS -o response.json \
          "https://api.github.com/repos/${GITHUB_REPO}/releases/tags/${CI_COMMIT_TAG}" \
          -H "Authorization: Bearer ${GITHUB_PAT}" \
          -H "Accept: application/vnd.github+json"
      else
        echo "GitHub refused the release (HTTP $CODE):"
        jq -r '.message // .' response.json
        exit 1
      fi
      RELEASE_ID=$(jq -r '.id' response.json)
      test "$RELEASE_ID" != "null" || { echo "no release id in response"; exit 1; }
      echo "RELEASE_ID=$RELEASE_ID" > release.env

    # Replace the asset when re-releasing a tag, then upload.
    - |
      . ./release.env
      EXISTING=$(curl -sS \
        "https://api.github.com/repos/${GITHUB_REPO}/releases/${RELEASE_ID}/assets" \
        -H "Authorization: Bearer ${GITHUB_PAT}" \
        -H "Accept: application/vnd.github+json" \
        | jq -r --arg n "${DOMAIN}.zip" '.[] | select(.name == $n) | .id')
      if [ -n "$EXISTING" ]; then
        curl -sS -X DELETE \
          "https://api.github.com/repos/${GITHUB_REPO}/releases/assets/${EXISTING}" \
          -H "Authorization: Bearer ${GITHUB_PAT}"
      fi
      CODE=$(curl -sS -o upload.json -w '%{http_code}' \
        -X POST "https://uploads.github.com/repos/${GITHUB_REPO}/releases/${RELEASE_ID}/assets?name=${DOMAIN}.zip" \
        -H "Authorization: Bearer ${GITHUB_PAT}" \
        -H "Content-Type: application/zip" \
        --data-binary "@${DOMAIN}.zip")
      test "$CODE" = "201" || { echo "asset upload failed (HTTP $CODE):"; jq -r '.message // .' upload.json; exit 1; }
      echo "published https://github.com/${GITHUB_REPO}/releases/tag/${CI_COMMIT_TAG}"
  after_script:
    - rm -f ~/.git-credentials
